<!DOCTYPE html>  <html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Photography Portfolio</title>  
    <style>  
        * { margin: 0; padding: 0; box-sizing: border-box; }  
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #0f0f0f; color: #fff; text-align: center; padding: 40px 20px; }  
        header { margin-bottom: 40px; }  
        h1 { font-size: 2.5rem; letter-spacing: 2px; font-weight: 300; margin-bottom: 10px; }  
        p.subtitle { color: #888; font-size: 1.1rem; }  
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }  
        .photo-card { background: #1e1e1e; border-radius: 8px; overflow: hidden; height: 250px; display: flex; align-items: center; justify-content: center; border: 1px solid #333; color: #555; }  
        footer { margin-top: 60px; color: #555; font-size: 0.9rem; }  
    </style>  
</head>  
<body>  
    <header>  
        <h1>PHOTOGRAPHY PORTFOLIO</h1>  
        <p class="subtitle">Capturing moments & visual stories</p>  
    </header>  <div class="gallery">  
    <div class="photo-card">Photo 1 Placeholder</div>  
    <div class="photo-card">Photo 2 Placeholder</div>  
    <div class="photo-card">Photo 3 Placeholder</div>  
</div>  

<footer>  
    <p>&copy; 2026 All Rights Reserved.</p>  
</footer>

</body>  
</html>
